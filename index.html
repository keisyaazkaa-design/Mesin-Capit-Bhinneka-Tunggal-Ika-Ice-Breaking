<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Capit Bhinneka Tunggal Ika</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link href="https://googleapis.com family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            touch-action: manipulation;
            user-select: none;
            overflow-x: hidden;
        }

        /* Arcade Machine Visual Style */
        .arcade-cabinet {
            background: linear-gradient(180deg, #ff5e62 0%, #ff9966 100%);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25), inset 0 5px 15px rgba(255, 255, 255, 0.4);
            border: 8px solid #33105c;
            border-radius: 28px;
        }

        .claw-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(200, 240, 255, 0.1) 100%);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.6), inset 0 -10px 20px rgba(0,0,0,0.15);
            border: 6px solid #ff1493;
        }

        .ball-capsule {
            transition: transform 0.2s ease, left 0.1s ease, top 0.1s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            cursor: pointer;
        }

        /* 3D Button Push Effects */
        .arcade-btn {
            box-shadow: 0 8px 0 #1b1035, 0 12px 15px rgba(0,0,0,0.3);
            transition: all 0.08s ease;
        }
        .arcade-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1b1035, 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Floating Light Animation */
        @keyframes pulse-lights {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3) drop-shadow(0 0 8px #fff); }
        }

        .marquee-light {
            animation: pulse-lights 1.2s infinite alternate;
        }

        /* Claw Animation Rig */
        #claw-string {
            width: 6px;
            background: linear-gradient(90deg, #888, #eee, #888);
        }

        .claw-arm-left {
            transform-origin: top right;
            transition: transform 0.3s ease;
        }
        .claw-arm-right {
            transform-origin: top left;
            transition: transform 0.3s ease;
        }

        .claw-closed .claw-arm-left {
            transform: rotate(30deg);
        }
        .claw-closed .claw-arm-right {
            transform: rotate(-30deg);
        }

        .claw-open .claw-arm-left {
            transform: rotate(-15deg);
        }
        .claw-open .claw-arm-right {
            transform: rotate(15deg);
        }

        /* Glass Shine Overlay */
        .glass-shine {
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 50%);
        }

        /* Confetti Canvas Container */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- TOP NAVIGATION HEADER -->
    <header class="w-full max-w-2xl flex justify-between items-center bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-lg border-2 border-amber-300 mb-2">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-red-500 to-amber-500 text-white p-2.5 rounded-xl shadow">
                <i class="fa-solid font-bold text-xl fa-shapes"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-black text-amber-900 leading-tight">Bhinneka Capit!</h1>
                <p class="text-xs font-bold text-amber-700">Ice Breaking Kebagusan Nusantara</p>
            </div>
        </div>

        <!-- Home Button linked to Canva URL -->
        <a href="https://canva.link" target="_blank" rel="noopener noreferrer" 
           class="flex items-center space-x-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold px-4 py-2 rounded-xl shadow-md transform hover:scale-105 transition-all border-2 border-emerald-300"
           title="Kembali ke Beranda / Menu Canva">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="hidden sm:inline text-sm">Kembali / Home</span>
        </a>
    </header>

    <canvas id="confetti-canvas"></canvas>

    <!-- MAIN ARCADE MACHINE SCREEN -->
    <main class="w-full max-w-xl flex-1 flex flex-col items-center justify-center my-auto">
        <div class="arcade-cabinet w-full p-4 sm:p-6 relative">
            
            <!-- Marquee Header with Glowing Bulb Lights -->
            <div class="bg-gradient-to-r from-purple-800 via-indigo-900 to-purple-800 rounded-2xl p-3 mb-3 border-4 border-yellow-400 shadow-inner flex items-center justify-between relative overflow-hidden">
                <div class="flex space-x-1.5">
                    <span class="marquee-light w-3 h-3 rounded-full bg-yellow-300 inline-block shadow"></span>
                    <span class="marquee-light w-3 h-3 rounded-full bg-red-400 inline-block shadow" style="animation-delay: 0.3s"></span>
                    <span class="marquee-light w-3 h-3 rounded-full bg-cyan-300 inline-block shadow" style="animation-delay: 0.6s"></span>
                </div>
                
                <h2 class="text-yellow-300 font-black text-lg sm:text-2xl tracking-wider uppercase text-shadow text-center drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
                    🎯 Kumpulkan 5 Bola 🎯
                </h2>

                <div class="flex space-x-1.5">
                    <span class="marquee-light w-3 h-3 rounded-full bg-cyan-300 inline-block shadow" style="animation-delay: 0.2s"></span>
                    <span class="marquee-light w-3 h-3 rounded-full bg-green-400 inline-block shadow" style="animation-delay: 0.5s"></span>
                    <span class="marquee-light w-3 h-3 rounded-full bg-yellow-300 inline-block shadow" style="animation-delay: 0.8s"></span>
                </div>
            </div>

            <!-- Score / Target Indicator Bar -->
            <div class="flex justify-between items-center bg-purple-950/80 text-white px-4 py-2 rounded-xl mb-3 border border-purple-400/30 text-xs sm:text-sm font-bold">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-trophy text-amber-400 text-lg"></i>
                    <span>Bola Terkumpul: <span id="collected-count" class="text-yellow-300 text-base font-extrabold">0</span> / 5</span>
                </div>
                <div id="balls-display-bar" class="flex space-x-2 text-yellow-400 text-lg">
                    <!-- Dynamic ball icons will appear here -->
                </div>
            </div>

            <!-- CLAW GLASS CONTAINER -->
            <div id="claw-box" class="claw-glass w-full h-[320px] sm:h-[360px] rounded-2xl relative overflow-hidden bg-slate-900/60">
                <!-- Glass shine effect -->
                <div class="glass-shine absolute inset-0 pointer-events-none z-20"></div>

                <!-- Top Rail for Crane -->
                <div class="absolute top-0 left-0 right-0 h-4 bg-gray-800 border-b-2 border-gray-600 z-10">
                    <div id="claw-rail-runner" class="h-5 w-16 bg-amber-500 rounded border border-amber-300 absolute top-0 shadow transition-all duration-100" style="left: 50%; transform: translateX(-50%);"></div>
                </div>

                <!-- CLAW MECHANISM ASSEMBLY -->
                <div id="claw-assembly" class="absolute z-10 flex flex-col items-center claw-open transition-all duration-100" style="left: 50%; top: 16px; transform: translateX(-50%);">
                    <!-- Claw Cable/String -->
                    <div id="claw-string" style="height: 40px;"></div>
                    <!-- Claw Head Hub -->
                    <div id="claw-head" class="relative flex justify-center items-top -mt-1">
                        <div class="w-8 h-8 bg-gray-300 rounded-full border-4 border-gray-600 z-10 flex items-center justify-center text-[10px] text-gray-800 font-bold">IK</div>
                        <!-- Left Claw Arm -->
                        <div class="claw-arm-left absolute right-3 top-4 w-5 h-10 border-l-4 border-b-4 border-yellow-400 rounded-bl-xl"></div>
                        <!-- Right Claw Arm -->
                        <div class="claw-arm-right absolute left-3 top-4 w-5 h-10 border-r-4 border-b-4 border-yellow-400 rounded-br-xl"></div>
                    </div>
                </div>

                <!-- PRIZE DROP CHUTE (Bak tempat bola keluar) -->
                <div class="absolute bottom-0 left-4 w-20 h-24 bg-gradient-to-t from-gray-800 to-gray-700 border-t-4 border-r-4 border-gray-600 rounded-tr-2xl z-10 flex flex-col items-center justify-center text-center shadow-inner">
                    <span class="text-[10px] text-yellow-300 font-black tracking-widest uppercase">HADIAH</span>
                    <i class="fa-solid fa-gift text-red-400 text-lg mt-1 animate-bounce"></i>
                </div>

                <!-- CONTAINER UNTUK BOLA CAPSULE -->
                <div id="capsules-container" class="absolute inset-0 top-16">
                    <!-- Bola-bola capsule akan di-generate otomatis via JavaScript -->
                </div>
            </div>
